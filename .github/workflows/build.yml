name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag Release'
        required: true
      build_type:
        description: 'Tipe Build'
        required: true
        default: 'release'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Download file ZIP dari Release pakai GitHub CLI
      - name: Download ZIP from Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir temp_extract
          gh release download ${{ github.event.inputs.tag }} --repo ${{ github.repository }} --pattern "*.zip" --dir ./temp_extract

      # 2. Extract ZIP dan pindahin project ke root
      - name: Extract & Flatten Project
        run: |
          cd temp_extract
          unzip *.zip -d ./extracted
          cd ..
          
          PUBSPEC_PATH=$(find temp_extract/extracted -name "pubspec.yaml" | head -n 1)
          if [ -z "$PUBSPEC_PATH" ]; then
            echo "❌ File pubspec.yaml tidak ditemukan!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$PUBSPEC_PATH")
          mv "$PROJECT_DIR"/* .
          rm -rf temp_extract

      # 3. Setup Java & Flutter
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. Build APK
      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --${{ github.event.inputs.build_type }}

      # 5. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-build
          path: build/app/outputs/flutter-apk/app-${{ github.event.inputs.build_type }}.apk
