name: Build Web to APK

on:
  workflow_dispatch:
    inputs:
      website_url:
        description: 'URL Website'
        required: true
      app_name:
        description: 'Nama Aplikasi'
        required: true
      icon_url:
        description: 'URL Icon'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # Di sini logika buat ngubah web jadi APK (WebView Wrapper)
      - name: Build Web to APK
        run: |
          echo "Membangun Web2APK untuk URL: ${{ github.event.inputs.website_url }}"
          echo "Nama App: ${{ github.event.inputs.app_name }}"
          echo "Icon: ${{ github.event.inputs.icon_url }}"
          
          # Catatan: Di sini kamu harus punya script atau template Flutter WebView
          # Untuk sekarang, ini cuma dummy (belum bikin APK beneran)
          # Karena project Flutter WebView-nya belum ada di repo ini.
          
          # Simulasi bikin file APK kosong biar bot bisa download
          mkdir -p build/app/outputs/flutter-apk/
          touch build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-build
          path: build/app/outputs/flutter-apk/app-release.apk
