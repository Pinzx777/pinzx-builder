name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag Release (otomatis dari bot)'
        required: true
      build_type:
        description: 'Tipe Build (debug/release)'
        required: true
        default: 'release'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Download file ZIP dari Release
      - name: Download Source ZIP
        run: |
          curl -L -o source.zip "https://github.com/Pinzx777/pinzx-builder/releases/download/${{ github.event.inputs.tag }}/Base%20Apks.zip"
          
      # 2. Extract file ZIP
      - name: Extract Source
        run: |
          unzip source.zip -d ./
          
      # 3. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 4. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 5. Build APK (Masuk ke folder PlanetProject dulu)
      - name: Get Dependencies
        working-directory: ./PlanetProject  # <--- KUNCI UTAMANYA DI SINI
        run: flutter pub get

      - name: Build APK
        working-directory: ./PlanetProject  # <--- INI JUGA
        run: flutter build apk --${{ github.event.inputs.build_type }}

      # 6. Upload APK (Ambil dari dalam folder PlanetProject)
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-build
          path: PlanetProject/build/app/outputs/flutter-apk/app-${{ github.event.inputs.build_type }}.apk
