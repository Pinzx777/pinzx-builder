name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag Release (otomatis dari bot)'
        required: true
      build_type:
        description: 'Tipe Build (debug/release)'
        required: true
        default: 'release'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Download file ZIP dari Release
      - name: Download Source ZIP
        run: |
          curl -L -o source.zip "https://github.com/Pinzx777/pinzx-builder/releases/download/${{ github.event.inputs.tag }}/Base%20Apks.zip"
          
      # 2. Extract file ZIP
      - name: Extract Source
        run: |
          unzip source.zip -d extracted_zip
          
      # 3. PINTER-PINTERAN: Cari pubspec.yaml dan pindahin ke root
      - name: Locate and Flatten Project
        run: |
          # Cari file pubspec.yaml di dalam folder hasil extract
          PUBSPEC_PATH=$(find extracted_zip -name "pubspec.yaml" | head -n 1)
          
          if [ -z "$PUBSPEC_PATH" ]; then
            echo "❌ ERROR: File pubspec.yaml tidak ditemukan di dalam ZIP!"
            exit 1
          fi
          
          # Ambil folder tempat pubspec.yaml berada
          PROJECT_DIR=$(dirname "$PUBSPEC_PATH")
          echo "✅ Ketemu project Flutter di folder: $PROJECT_DIR"
          
          # Pindahin semua isi folder project ke root (tempat kerja GitHub Actions)
          mv "$PROJECT_DIR"/* .
          mv "$PROJECT_DIR"/.* . 2>/dev/null || true # Buat jaga-jaga kalau ada file hidden
          
      # 4. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 5. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 6. Get Dependencies & Build
      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --${{ github.event.inputs.build_type }}

      # 7. Upload APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-build
          path: build/app/outputs/flutter-apk/app-${{ github.event.inputs.build_type }}.apk
