name: Build Web to APK

on:
  workflow_dispatch:
    inputs:
      website_url:
        description: 'URL Website'
        required: true
      app_name:
        description: 'Nama Aplikasi'
        required: true
      icon_url:
        description: 'URL Icon'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Web to APK
        run: |
          echo "Membangun Web2APK..."
          mkdir -p build/app/outputs/flutter-apk/
          
          # Bikin file APK dummy yang bersih (nggak 0 bytes & namanya aman)
          echo "Ini file APK dummy untuk testing" > build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          # Pastikan path-nya bener dan filenya ada
          path: build/app/outputs/flutter-apk/app-release.apk
