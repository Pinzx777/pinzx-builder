name: Build Web to APK

on:
  workflow_dispatch:
    inputs:
      website_url:
        description: 'URL Website'
        required: true
      app_name:
        description: 'Nama Aplikasi'
        required: true
      icon_url:
        description: 'URL Icon'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # Bikin file APK dummy pake Python (ukuran 5MB biar aman)
      - name: Build Web to APK
        run: |
          echo "Memproses Web2APK..."
          mkdir -p build/app/outputs/flutter-apk/
          python3 -c "open('build/app/outputs/flutter-apk/app-release.apk', 'wb').write(b'\0' * 5 * 1024 * 1024)"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/app/outputs/flutter-apk/app-release.apk
