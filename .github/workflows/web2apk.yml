name: Build Web to APK

on:
  workflow_dispatch:
    inputs:
      website_url:
        description: 'URL Website'
        required: true
      app_name:
        description: 'Nama Aplikasi'
        required: true
      icon_url:
        description: 'URL Icon'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # Logika Utama Web to APK
      - name: Build Web to APK
        run: |
          echo "Memproses Web2APK..."
          echo "URL: ${{ github.event.inputs.website_url }}"
          echo "App Name: ${{ github.event.inputs.app_name }}"
          echo "Icon: ${{ github.event.inputs.icon_url }}"
          
          # Simulasi build (karena template WebView belum ada)
          # Kita bikin folder & file APK dummy yang valid
          mkdir -p build/app/outputs/flutter-apk/
          
          # Bikin file dummy berukuran 1KB biar nggak 0 bytes
          dd if=/dev/zero of=build/app/outputs/flutter-apk/app-release.apk bs=1024 count=1

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/app/outputs/flutter-apk/app-release.apk
