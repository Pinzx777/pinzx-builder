name: Build Web to APK

on:
  workflow_dispatch:
    inputs:
      website_url:
        description: 'URL Website'
        required: true
      app_name:
        description: 'Nama Aplikasi'
        required: true
      icon_url:
        description: 'URL Icon'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # Logika Utama Web to APK (Dummy buat ngetes alur)
      - name: Build Web to APK
        run: |
          echo "Memproses Web2APK..."
          echo "URL: ${{ github.event.inputs.website_url }}"
          echo "App Name: ${{ github.event.inputs.app_name }}"
          
          # Bikin folder & file APK dummy berukuran 10KB biar valid
          mkdir -p build/app/outputs/flutter-apk/
          dd if=/dev/zero of=build/app/outputs/flutter-apk/app-release.apk bs=1024 count=10

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/app/outputs/flutter-apk/app-release.apk
