name: Build Web to APK

on:
  workflow_dispatch:
    inputs:
      website_url:
        description: 'URL Website'
        required: true
      app_name:
        description: 'Nama Aplikasi'
        required: true
      icon_url:
        description: 'URL Icon'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # Bikin file APK dummy 10KB pake Linux command
      - name: Build Web to APK (Dummy)
        run: |
          echo "Memproses Web2APK..."
          # 1. Bikin folder
          mkdir -p build/app/outputs/flutter-apk/
          
          # 2. Bikin file dummy 10KB
          dd if=/dev/zero of=build/app/outputs/flutter-apk/app-release.apk bs=1024 count=10
          
          # 3. Cek apakah file beneran ada
          ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/app/outputs/flutter-apk/app-release.apk
